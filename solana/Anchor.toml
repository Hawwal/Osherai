[features]
seeds = false
skip-lint = false

[programs.mainnet]
osher_monitor = "PLACEHOLDER_REPLACE_AFTER_DEPLOY"

[programs.devnet]
osher_monitor = "PLACEHOLDER_REPLACE_AFTER_DEPLOY"

[registry]
url = "https://api.apr.dev"

[provider]
# Switch between "mainnet", "devnet", "localnet"
cluster = "mainnet"
wallet   = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/osher_monitor"]
