<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Osher AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__osherBootError = function(message) {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          var safe = String(message).replace(/[&<>]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
          root.innerHTML = '<div style="font-family:system-ui;padding:24px;color:#171717"><strong>Osher AI could not start.</strong><br/><span style="font-size:13px;color:#6b6b8a">' + safe + '</span></div>';
        }
      };
      window.addEventListener('error', function(e) { window.__osherBootError(e.message); });
      window.addEventListener('unhandledrejection', function(e) { window.__osherBootError(e.reason && (e.reason.message || e.reason) || 'Unhandled startup error'); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
